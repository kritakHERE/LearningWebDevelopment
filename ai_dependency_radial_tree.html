};

};

let collapsed = new Set();
let svgEl, transformState = {scale:1, panX:0, panY:0};

function buildTree() {
  const svg = document.getElementById('radial');
  svgEl = svg;
  renderTree();
  setupPanZoom(svg);
}

function getVisibleNodes() {
  const visible = new Set();
  function walk(id) {
    const node = NODES[id];
    if (!node) return;
    visible.add(id);
    if (!collapsed.has(id) && node.children) {
      node.children.forEach(cid => { if (NODES[cid]) walk(cid); });
    }
  }
  walk('ai');
  return visible;
}

const RING_RADII = [0, 130, 255, 375, 490, 600, 660];
const NODE_R = [28, 22, 20, 18, 16, 15, 13];

function getAngleMap() {
  const visible = getVisibleNodes();
  const levelNodes = {};
  for (const id of visible) {
    const l = NODES[id].level;
    if (!levelNodes[l]) levelNodes[l] = [];
    levelNodes[l].push(id);
  }
  const angles = {};
  angles['ai'] = 0;
  [1,2,3,4,5,6].forEach(l => {
    if (!levelNodes[l]) return;
    const n = levelNodes[l].length;
    levelNodes[l].forEach((id, i) => {
      angles[id] = (2 * Math.PI * i / n) - Math.PI / 2;
    });
  });
  return {angles, visible};
}

function polar(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }

function renderTree() {
  const svg = document.getElementById('radial');
  svg.innerHTML = '';
  const {angles, visible} = getAngleMap();

  const ringGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  ringGroup.setAttribute('opacity','0.12');
  [130,255,375,490,600,660].forEach((r,i) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx','0'); c.setAttribute('cy','0');
    c.setAttribute('r', r);
    c.setAttribute('fill','none');
    c.setAttribute('stroke', i < 3 ? '#38BDF8' : i < 5 ? '#A78BFA' : '#34D399');
    c.setAttribute('stroke-width','0.5');
    c.setAttribute('stroke-dasharray','3 4');
    ringGroup.appendChild(c);
  });
  svg.appendChild(ringGroup);

  const edgeGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  for (const id of visible) {
    const node = NODES[id];
    if (!node.children) continue;
    const [px, py] = id === 'ai' ? [0,0] : polar(RING_RADII[node.level], angles[id]);
    node.children.forEach(cid => {
      if (!visible.has(cid)) return;
      const child = NODES[cid];
      const [cx, cy] = polar(RING_RADII[child.level], angles[cid]);
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      const mx = (px + cx) / 2 * 0.6;
      const my = (py + cy) / 2 * 0.6;
      const d = `M${px},${py} Q${mx},${my} ${cx},${cy}`;
      path.setAttribute('d', d);
      path.setAttribute('fill','none');
      const pc = LEVEL_COLORS[node.level];
      const cc = LEVEL_COLORS[child.level];
      const gid = `g_${id}_${cid}`;
      const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
      const grad = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
      grad.setAttribute('id', gid);
      grad.setAttribute('gradientUnits','userSpaceOnUse');
      grad.setAttribute('x1', px); grad.setAttribute('y1', py);
      grad.setAttribute('x2', cx); grad.setAttribute('y2', cy);
      const s1 = document.createElementNS('http://www.w3.org/2000/svg','stop');
      s1.setAttribute('offset','0%'); s1.setAttribute('stop-color', pc); s1.setAttribute('stop-opacity','0.6');
      const s2 = document.createElementNS('http://www.w3.org/2000/svg','stop');
      s2.setAttribute('offset','100%'); s2.setAttribute('stop-color', cc); s2.setAttribute('stop-opacity','0.6');
      grad.appendChild(s1); grad.appendChild(s2);
      defs.appendChild(grad);
      svg.insertBefore(defs, svg.firstChild);
      path.setAttribute('stroke', `url(#${gid})`);
      path.setAttribute('stroke-width','1');
      edgeGroup.appendChild(path);
    });
  }
  svg.appendChild(edgeGroup);

  const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  for (const id of visible) {
    const node = NODES[id];
    const r = RING_RADII[node.level];
    const [x, y] = id === 'ai' ? [0,0] : polar(r, angles[id]);
    const color = LEVEL_COLORS[node.level];
    const nr = NODE_R[node.level];
    const hasChildren = node.children && node.children.length > 0;
    const isCollapsed = collapsed.has(id);

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('cursor','pointer');
    g.setAttribute('transform',`translate(${x},${y})`);

    if (node.level === 0) {
      const glow = document.createElementNS('http://www.w3.org/2000/svg','circle');
      glow.setAttribute('cx','0'); glow.setAttribute('cy','0');
      glow.setAttribute('r', nr + 10);
      glow.setAttribute('fill', color); glow.setAttribute('opacity','0.12');
      g.appendChild(glow);
    }

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx','0'); circle.setAttribute('cy','0');
    circle.setAttribute('r', nr);
    circle.setAttribute('fill', '#0A0E1A');
    circle.setAttribute('stroke', color);
    circle.setAttribute('stroke-width', node.level === 0 ? '2' : '1.5');
    circle.setAttribute('opacity', isCollapsed ? '0.5' : '1');
    g.appendChild(circle);

    if (hasChildren && !isCollapsed) {
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx','0'); dot.setAttribute('cy','0');
      dot.setAttribute('r', Math.max(3, nr * 0.25));
      dot.setAttribute('fill', color); dot.setAttribute('opacity','0.7');
      g.appendChild(dot);
    }
    if (hasChildren && isCollapsed) {
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x','0'); t.setAttribute('y','1');
      t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central');
      t.setAttribute('font-size','10'); t.setAttribute('fill', color); t.setAttribute('opacity','0.9');
      t.textContent = '+';
      g.appendChild(t);
    }

    const lines = node.label.split('\n');
    const offsetY = r < 150 ? nr + 14 : (x > 0 ? nr + 14 : -(nr + 14));
    const anchor = r < 150 ? 'middle' : (x > 20 ? 'start' : x < -20 ? 'end' : 'middle');
    const lx = r < 150 ? 0 : (x > 20 ? nr + 4 : x < -20 ? -(nr + 4) : 0);
    const startY = r < 150 ? offsetY : (lines.length > 1 ? -7 : 0);

    lines.forEach((line, i) => {
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', r < 150 ? 0 : lx);
      t.setAttribute('y', r < 150 ? (offsetY + i * 13) : (startY + i * 13));
      t.setAttribute('text-anchor', anchor);
      t.setAttribute('dominant-baseline','central');
      t.setAttribute('font-family',"'JetBrains Mono', monospace");
      t.setAttribute('font-size', node.level <= 1 ? '10' : '8.5');
      t.setAttribute('fill', color);
      t.setAttribute('opacity', isCollapsed ? '0.5' : '0.9');
      t.textContent = line;
      g.appendChild(t);
    });

    g.addEventListener('click', (e) => {
      e.stopPropagation();
      if (hasChildren) {
        if (collapsed.has(id)) collapsed.delete(id);
        else collapsed.add(id);
        renderTree();
      } else {
        openModal(id);
      }
    });
    g.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      openModal(id);
    });

    g.addEventListener('mouseenter', () => {
      circle.setAttribute('opacity','0.85');
      circle.setAttribute('stroke-width', (node.level === 0 ? 2.5 : 2).toString());
    });
    g.addEventListener('mouseleave', () => {
      circle.setAttribute('opacity', isCollapsed ? '0.5' : '1');
      circle.setAttribute('stroke-width', (node.level === 0 ? 2 : 1.5).toString());
    });

    nodeGroup.appendChild(g);
  }
  svg.appendChild(nodeGroup);
}

function openModal(id) {
  const node = NODES[id];
  const color = LEVEL_COLORS[node.level];
  const badgeBg = LEVEL_BADGE_BG[node.level];
  const badge = document.getElementById('modal-level-badge');
  badge.textContent = `L${node.level} · ${['Root','Paradigm','Sub-paradigm','Domain','Architecture','Framework','Library'][node.level] || 'Core'}`;
  badge.style.background = badgeBg;
  badge.style.color = color;
  document.getElementById('modal-title').textContent = node.label.replace('\n',' ');
  document.getElementById('modal-desc').textContent = node.desc;

  const depSection = document.getElementById('modal-depends');
  const depTags = document.getElementById('modal-depends-tags');
  if (node.dependsOn && node.dependsOn.length) {
    depSection.style.display = 'block';
    depTags.innerHTML = node.dependsOn.map(t => `<span class="modal-tag">${t}</span>`).join('');
  } else { depSection.style.display = 'none'; }

  const useSection = document.getElementById('modal-usedby');
  const useTags = document.getElementById('modal-usedby-tags');
  if (node.usedBy && node.usedBy.length) {
    useSection.style.display = 'block';
    useTags.innerHTML = node.usedBy.map(t => `<span class="modal-tag">${t}</span>`).join('');
  } else { useSection.style.display = 'none'; }

  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

function resetView() {
  transformState = {scale:1, panX:0, panY:0};
  applyTransform();
}
function expandAll() { collapsed.clear(); renderTree(); }
function collapseToRoot() {
  Object.keys(NODES).forEach(id => { if(id !== 'ai') collapsed.add(id); });
  collapsed.delete('ai');
  renderTree();
}

function applyTransform() {
  const inner = document.querySelector('#radial > g:last-of-type');
  const allGs = document.querySelectorAll('#radial > g');
  allGs.forEach(g => {
    g.setAttribute('transform', `translate(${transformState.panX},${transformState.panY}) scale(${transformState.scale})`);
  });
}

function setupPanZoom(svg) {
  let isDragging = false, lastX = 0, lastY = 0;
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.91;
    transformState.scale = Math.min(4, Math.max(0.3, transformState.scale * factor));
    applyTransformAll();
  }, {passive:false});
  svg.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    transformState.panX += dx; transformState.panY += dy;
    lastX = e.clientX; lastY = e.clientY;
    applyTransformAll();
  });
  window.addEventListener('mouseup', () => { isDragging = false; });

  let lt1 = 0, lt2 = 0;
  svg.addEventListener('touchstart', e => {
    if(e.touches.length===2){lt1=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);}
    else if(e.touches.length===1){lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
  },{passive:true});
  svg.addEventListener('touchmove', e => {
    if(e.touches.length===2){
      const d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      transformState.scale=Math.min(4,Math.max(0.3,transformState.scale*(d/lt1)));lt1=d;applyTransformAll();
    } else if(e.touches.length===1){
      const dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;
      transformState.panX+=dx;transformState.panY+=dy;
      lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;applyTransformAll();
    }
  },{passive:true});
}

function applyTransformAll() {
  const groups = document.querySelectorAll('#radial > g');
  groups.forEach(g => {
    g.setAttribute('transform', `translate(${transformState.panX},${transformState.panY}) scale(${transformState.scale})`);
  });
}

buildTree();
</script>

.node-children.collapsed{display:none}
.modal-wrap{display:none;position:relative;margin-top:1.5rem;background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:12px;padding:20px 20px 16px}

const LEVEL_NAMES = ["Root","Paradigm","Sub-paradigm","Domain","Architecture","Framework","Library"];

function renderNode(node, container, isRoot){
  const wrapper = document.createElement('div');
  wrapper.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'node-row';

  if(!isRoot){
    const hline = document.createElement('div');
    hline.className = 'node-hline';
    row.appendChild(hline);
  }

  const pill = document.createElement('div');
  pill.className = `node-pill depth-${node.level}`;
  pill.setAttribute('role','button');
  pill.setAttribute('tabindex','0');
  pill.setAttribute('title', node.label);

  const labelSpan = document.createElement('span');
  labelSpan.textContent = node.label;
  pill.appendChild(labelSpan);

  const hasChildren = node.children && node.children.length > 0;
  let expandIcon = null;
  if(hasChildren){
    expandIcon = document.createElement('em');
    expandIcon.className = 'expand-icon';
    expandIcon.textContent = '▾';
    pill.appendChild(expandIcon);
  }
  row.appendChild(pill);
  wrapper.appendChild(row);

  let childrenDiv = null;
  let collapsed = false;

  if(hasChildren){
    childrenDiv = document.createElement('div');
    childrenDiv.className = 'node-children';
    node.children.forEach(child => renderNode(child, childrenDiv, false));
    wrapper.appendChild(childrenDiv);

    const toggle = () => {
      collapsed = !collapsed;
      childrenDiv.classList.toggle('collapsed', collapsed);
      expandIcon.textContent = collapsed ? '▸' : '▾';
    };
    pill.addEventListener('click', toggle);
    pill.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }});
  } else {
    pill.addEventListener('click', () => openModal(node));
    pill.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModal(node); }});
  }

  container.appendChild(wrapper);
}

function openModal(node){
  const BADGE_COLORS = {
    0:'background:var(--bg-accent);color:var(--text-accent)',
    1:'background:#f0eeff;color:#3c3489',2:'background:#f0eeff;color:#3c3489',
    3:'background:#e8faf3;color:#085041',4:'background:#e8faf3;color:#085041',
    5:'background:#e1f5ee;color:#04342c',6:'background:#d6f0e6;color:#04342c'
  };
  const badge = document.getElementById('m-badge');
  badge.textContent = `L${node.level} · ${LEVEL_NAMES[node.level]||'Library'}`;
  badge.style.cssText = BADGE_COLORS[node.level]||'';
  document.getElementById('m-title').textContent = node.label;
  document.getElementById('m-desc').textContent = node.desc||'';

  const dw = document.getElementById('m-depends-wrap');
  const dt = document.getElementById('m-depends');
  if(node.dependsOn && node.dependsOn.length){
    dw.style.display='block';
    dt.innerHTML = node.dependsOn.map(t=>`<span class="tag">${t}</span>`).join('');
  } else { dw.style.display='none'; }

  const uw = document.getElementById('m-usedby-wrap');
  const ut = document.getElementById('m-usedby');
  if(node.usedBy && node.usedBy.length){
    uw.style.display='block';
    ut.innerHTML = node.usedBy.map(t=>`<span class="tag">${t}</span>`).join('');
  } else { uw.style.display='none'; }

  const modal = document.getElementById('info-modal');
  modal.classList.add('open');
  modal.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closeModal(){ document.getElementById('info-modal').classList.remove('open'); }

const root = document.getElementById('tree-root');
renderNode(DATA, root, true);
</script>

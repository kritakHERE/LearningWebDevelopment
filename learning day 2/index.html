<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Learning Day 2</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1 id="page-title">JavaScript Learning Day 2</h1>

    <section class="counter-panel" aria-label="Counter practice">
      <p class="label">Counter Value</p>
      <p id="counter-display" class="counter-display neutral">0</p>

      <div class="button-row">
        <button id="decrease-button" type="button">Decrease</button>
        <button id="reset-button" type="button">Reset</button>
        <button id="increase-button" type="button">Increase</button>
      </div>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML File Explorer – LearningWebDevelopment</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --border: #e1e5eb;
            --text: #1a1d23;
            --secondary: #6b7280;
            --accent: #2563eb;
            --accent-light: #eef2ff;
            --hover: #f9fafb;
            --radius: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 0.3rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .search-box {
            margin: 1.2rem 2rem;
            display: flex;
            gap: 0.5rem;
        }

        #searchInput {
            flex: 1;
            padding: 0.65rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
            background: var(--card);
        }

        #searchInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.65rem 1.4rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-outline:hover {
            background: var(--accent-light);
        }

        .content {
            padding: 0 2rem 2rem;
        }

        /* Tree styles */
        .tree-container {
            margin-top: 0.5rem;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .tree-root {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .tree-root ul {
            list-style: none;
            padding-left: 1.5rem;
            border-left: 1px solid var(--border);
            margin-left: 0.5rem;
        }

        .tree-folder {
            margin: 2px 0;
        }

        .tree-folder>summary {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.45rem 0.5rem;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            font-weight: 500;
            list-style: none;
        }

        .tree-folder>summary::-webkit-details-marker {
            display: none;
        }

        .tree-folder>summary:hover {
            background: var(--hover);
        }

        .tree-folder>summary .arrow {
            display: inline-block;
            width: 18px;
            font-size: 0.7rem;
            transition: transform 0.2s;
            color: var(--secondary);
            text-align: center;
        }

        .tree-folder[open]>summary .arrow {
            transform: rotate(90deg);
            color: var(--accent);
        }

        .tree-file {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.4rem 0.5rem 0.4rem 1.8rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
            color: inherit;
        }

        .tree-file:hover {
            background: var(--hover);
        }

        .tree-file.active {
            background: var(--accent-light);
            font-weight: 500;
        }

        .tree-file .file-name {
            font-family: var(--mono);
            font-size: 0.88rem;
            word-break: break-all;
        }

        .folder-icon, .file-icon {
            flex-shrink: 0;
            font-size: 1rem;
        }

        .badge {
            font-size: 0.7rem;
            background: #e5e7eb;
            color: #4b5563;
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            margin-left: 0.5rem;
            font-weight: 500;
        }

        .loading, .error, .empty {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--secondary);
        }

        .loading .spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid #e5e7eb;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.8rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--secondary);
            text-align: center;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 LearningWebDevelopment</h1>
            <p>Click any HTML file to open it directly</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Filter files by name..." autocomplete="off">
            <button class="btn" id="btnExpandAll">Expand All</button>
            <button class="btn btn-outline" id="btnCollapseAll">Collapse</button>
        </div>

        <div class="content">
            <div id="treeWrapper" class="tree-container">
                <div class="loading" id="loadingState">
                    <div class="spinner"></div>
                    <p>Fetching file list from GitHub...</p>
                </div>
                <div class="error" id="errorState" style="display: none;">
                    <p>⚠️ Could not load file tree.</p>
                    <p style="font-size:0.85rem; margin-top:0.5rem;" id="errorMessage"></p>
                    <button class="btn" style="margin-top:1rem;" onclick="location.reload()">Retry</button>
                </div>
                <div class="empty" id="emptyState" style="display: none;">
                    <p>📭 No .html files found in this repository.</p>
                </div>
                <ul class="tree-root" id="treeRoot" style="display: none;"></ul>
            </div>
        </div>
    </div>
    <div class="footer">
        Built with GitHub API • <a href="https://github.com/kritakhere/LearningWebDevelopment" target="_blank">View Repository</a>
    </div>

    <script>
        (function() {
            // ── Configuration ─────────────────
            const REPO_OWNER = 'kritakhere';
            const REPO_NAME = 'LearningWebDevelopment';
            const BASE_URL = `https://${REPO_OWNER}.github.io/${REPO_NAME}/`;
            const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;

            // ── DOM Elements ──────────────────
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const errorMessage = document.getElementById('errorMessage');
            const emptyState = document.getElementById('emptyState');
            const treeRoot = document.getElementById('treeRoot');
            const searchInput = document.getElementById('searchInput');
            const btnExpandAll = document.getElementById('btnExpandAll');
            const btnCollapseAll = document.getElementById('btnCollapseAll');

            let allFileEntries = []; // { path, url }

            // ── Fetch file tree via GitHub Git Trees API (recursive) ──
            async function fetchFileTree() {
                try {
                    // 1. Get repository info to find default branch
                    const repoRes = await fetch(API_BASE);
                    if (!repoRes.ok) throw new Error('Repository not found or API rate limit exceeded.');
                    const repoData = await repoRes.json();
                    const defaultBranch = repoData.default_branch || 'main';

                    // 2. Get the latest commit SHA of the default branch
                    const branchRes = await fetch(`${API_BASE}/branches/${defaultBranch}`);
                    if (!branchRes.ok) throw new Error('Branch not found.');
                    const branchData = await branchRes.json();
                    const commitSha = branchData.commit.sha;

                    // 3. Fetch the entire file tree recursively
                    const treeRes = await fetch(`${API_BASE}/git/trees/${commitSha}?recursive=1`);
                    if (!treeRes.ok) throw new Error('Failed to fetch repository tree.');
                    const treeData = await treeRes.json();

                    if (!treeData.tree || treeData.tree.length === 0) {
                        throw new Error('Repository appears empty.');
                    }

                    // 4. Filter only .html files (ignore case)
                    const htmlEntries = treeData.tree.filter(item =>
                        item.type === 'blob' &&
                        item.path.toLowerCase().endsWith('.html')
                    );

                    if (htmlEntries.length === 0) {
                        showEmpty();
                        return;
                    }

                    // 5. Build file objects with full URLs
                    allFileEntries = htmlEntries.map(item => ({
                        path: item.path,
                        url: BASE_URL + item.path.replace(/^\//, '')
                    }));

                    // 6. Render tree
                    renderTree(allFileEntries);
                    hideLoading();

                } catch (err) {
                    showError(err.message);
                }
            }

            function hideLoading() {
                loadingState.style.display = 'none';
                treeRoot.style.display = 'block';
            }

            function showError(msg) {
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
                errorMessage.textContent = msg || 'An unknown error occurred.';
            }

            function showEmpty() {
                loadingState.style.display = 'none';
                emptyState.style.display = 'block';
            }

            // ── Build hierarchical tree from flat file list ──
            function renderTree(files) {
                treeRoot.innerHTML = '';

                // Group files into folder structure
                const root = {};

                files.forEach(file => {
                    const parts = file.path.split('/');
                    let current = root;
                    parts.forEach((part, index) => {
                        if (index === parts.length - 1) {
                            // It's a file
                            if (!current._files) current._files = [];
                            current._files.push({
                                name: part,
                                path: file.path,
                                url: file.url
                            });
                        } else {
                            // It's a folder
                            if (!current[part]) {
                                current[part] = {};
                            }
                            current = current[part];
                        }
                    });
                });

                // Recursively build DOM elements
                function buildNode(obj, depth = 0) {
                    const ul = document.createElement('ul');

                    // Folders first
                    const folderNames = Object.keys(obj).filter(k => k !== '_files').sort();
                    folderNames.forEach(folderName => {
                        const li = document.createElement('li');
                        li.classList.add('tree-folder');

                        const details = document.createElement('details');
                        details.open = true; // expanded by default

                        const summary = document.createElement('summary');
                        summary.innerHTML = `
                            <span class="arrow">▶</span>
                            <span class="folder-icon">📁</span>
                            ${escapeHtml(folderName)}
                            <span class="badge">${countFiles(obj[folderName])} file${countFiles(obj[folderName]) !== 1 ? 's' : ''}</span>
                        `;
                        details.appendChild(summary);

                        // Update folder icon on toggle
                        details.addEventListener('toggle', () => {
                            const icon = details.querySelector('.folder-icon');
                            icon.textContent = details.open ? '📂' : '📁';
                        });
                        // Set initial open icon
                        summary.querySelector('.folder-icon').textContent = '📂';

                        const childUl = buildNode(obj[folderName], depth + 1);
                        details.appendChild(childUl);
                        li.appendChild(details);
                        ul.appendChild(li);
                    });

                    // Files second
                    if (obj._files && obj._files.length > 0) {
                        obj._files
                            .sort((a, b) => a.name.localeCompare(b.name))
                            .forEach(file => {
                                const li = document.createElement('li');
                                const a = document.createElement('a');
                                a.href = file.url;
                                a.classList.add('tree-file');
                                a.target = '_blank'; // open in new tab
                                a.innerHTML = `
                                    <span class="file-icon">📄</span>
                                    <span class="file-name">${escapeHtml(file.name)}</span>
                                `;
                                a.title = file.path;
                                li.appendChild(a);
                                ul.appendChild(li);
                            });
                    }

                    return ul;
                }

                // Helper to count total files inside a folder node (including subfolders)
                function countFiles(node) {
                    let count = 0;
                    if (node._files) count += node._files.length;
                    Object.keys(node).forEach(k => {
                        if (k !== '_files') count += countFiles(node[k]);
                    });
                    return count;
                }

                const treeFragment = buildNode(root);
                treeRoot.appendChild(treeFragment);
            }

            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            // ── Filter functionality ──────────
            searchInput.addEventListener('input', function() {
                const filter = this.value.toLowerCase().trim();
                const allFiles = document.querySelectorAll('.tree-file');
                const allFolders = document.querySelectorAll('.tree-folder');

                if (!filter) {
                    // Show everything
                    allFiles.forEach(el => el.style.display = '');
                    allFolders.forEach(el => el.style.display = '');
                    return;
                }

                // Hide files that don't match
                allFiles.forEach(el => {
                    const name = el.querySelector('.file-name').textContent.toLowerCase();
                    el.style.display = name.includes(filter) ? '' : 'none';
                });

                // Show/hide folders based on visible children
                allFolders.forEach(folder => {
                    const details = folder.querySelector('details');
                    if (!details) return;
                    const hasVisibleFile = details.querySelectorAll('.tree-file').length > 0 &&
                        Array.from(details.querySelectorAll('.tree-file')).some(f => f.style.display !== 'none');
                    folder.style.display = hasVisibleFile ? '' : 'none';
                });
            });

            // ── Expand / Collapse all ──────────
            btnExpandAll.addEventListener('click', () => {
                document.querySelectorAll('.tree-folder details').forEach(d => {
                    d.open = true;
                    const icon = d.querySelector('.folder-icon');
                    if (icon) icon.textContent = '📂';
                });
            });

            btnCollapseAll.addEventListener('click', () => {
                document.querySelectorAll('.tree-folder details').forEach(d => {
                    d.open = false;
                    const icon = d.querySelector('.folder-icon');
                    if (icon) icon.textContent = '📁';
                });
            });

            // ── Start ─────────────────────────
            fetchFileTree();

        })();
    </script>
</body>
</html>
